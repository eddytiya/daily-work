<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Daily Work — Your work, remembered</title><link rel="stylesheet" href="style.css"></head><body>
<header><a class="brand" href="/">daily<span>work</span><span class="brand-dot"></span></a><span class="local">Saved on this computer</span><button id="export">Export backup</button></header>
<main><div class="intro"><div><h1>Make a little record.<br>See how far you’ve come.</h1><p>A home for the work you do, one day at a time.</p></div><button class="primary" id="new">+ Log today’s work</button></div>
<div class="workspace"><section class="calendar-panel"><div class="calendar-heading"><h2 id="month"></h2><div class="nav"><button id="prev" aria-label="Previous month">←</button><button id="today">Today</button><button id="next" aria-label="Next month">→</button></div></div><div class="weekdays"><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span></div><div id="calendar" class="calendar"></div><div class="legend"><span><i></i> Work recorded</span><span id="summary"></span></div><div class="search-wrap"><label for="search">Find something you worked on</label><input id="search" type="search" placeholder="Search titles and notes…"><div id="results"></div></div></section>
<aside><div class="day-heading"><span id="dayLabel"></span><h2 id="dayTitle"></h2></div><div id="entries"></div><form id="form"><h3 id="formTitle">Add a work entry</h3><input id="entryId" type="hidden"><label for="date">Date</label><input id="date" type="date" required><label for="title">What did you work on?</label><input id="title" maxlength="160" placeholder="e.g. Finished the project proposal" required><label for="notes">A few details <span>(optional)</span></label><textarea id="notes" rows="4" placeholder="What you did, what you learned, or what’s next…"></textarea><div class="form-row"><div><label for="category">Category</label><select id="category"><option>Work</option><option>Learning</option><option>Meeting</option><option>Personal</option></select></div><div><label for="hours">Hours <span>(optional)</span></label><input id="hours" type="number" min="0" max="24" step="0.25" placeholder="0"></div></div><div class="form-actions"><button type="submit" class="primary" id="save">Save entry</button><button type="button" id="cancel" hidden>Cancel edit</button></div></form></aside></div><footer>Your days add up. Keep a record of them.<span>Local storage · SQLite database</span></footer></main><div id="status" role="status" aria-live="polite"></div><script src="app.js"></script></body></html>
